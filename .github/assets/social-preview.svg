<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181b" stroke-width="1"/>
    </pattern>

    <linearGradient id="card-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Solid Dark Matte Canvas -->
  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Minimalist Header Pill -->
  <g transform="translate(500, 48)">
    <rect width="280" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="140" y="18" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">DISNEY CREATIVE STRATEGY</text>
  </g>

  <!-- Typography: Architectural & Solid -->
  <text x="640" y="128" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-1.2">DISNEY ARCHITECT</text>
  <text x="640" y="162" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400" text-anchor="middle" letter-spacing="-0.2">Universal Multi-Stage Software Architecture &amp; Scaffolding Framework</text>

  <!-- Structural Pipeline Connectors -->
  <path d="M 420 335 L 460 335" stroke="#27272a" stroke-width="1.5"/>
  <polygon points="465,335 457,331 457,339" fill="#3f3f46"/>
  <path d="M 820 335 L 860 335" stroke="#27272a" stroke-width="1.5"/>
  <polygon points="865,335 857,331 857,339" fill="#3f3f46"/>

  <!-- 3 Minimalist Engineering Cards -->

  <!-- CARD 01: THE DREAMER -->
  <g transform="translate(80, 210)">
    <rect width="340" height="250" rx="8" fill="#0c0c0e"/>
    <rect width="340" height="250" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1"/>
    
    <!-- Header -->
    <text x="24" y="38" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">STAGE 01</text>
    <text x="24" y="66" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="700">The Dreamer</text>
    <rect x="238" y="24" width="78" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="277" y="38" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">VISION</text>

    <line x1="24" y1="84" x2="316" y2="84" stroke="#18181b" stroke-width="1"/>

    <!-- Content Items -->
    <text x="24" y="118" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Unconstrained Scope</text>
    <text x="24" y="136" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Ignore infrastructure limits &amp; budget</text>

    <text x="24" y="168" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">3 Killer Differentiators</text>
    <text x="24" y="186" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">10x high-leverage product capabilities</text>

    <text x="24" y="218" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">User Value Journey</text>
    <text x="24" y="236" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">First contact to retention aha-moment</text>
  </g>

  <!-- CARD 02: THE REALIST -->
  <g transform="translate(470, 210)">
    <rect width="340" height="250" rx="8" fill="#0c0c0e"/>
    <rect width="340" height="250" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1"/>
    
    <!-- Header -->
    <text x="24" y="38" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">STAGE 02</text>
    <text x="24" y="66" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="700">The Realist</text>
    <rect x="238" y="24" width="78" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="277" y="38" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ARCH</text>

    <line x1="24" y1="84" x2="316" y2="84" stroke="#18181b" stroke-width="1"/>

    <!-- Content Items -->
    <text x="24" y="118" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Prune to 48-Hour MVP</text>
    <text x="24" y="136" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Veto authority: strip non-essential scope</text>

    <text x="24" y="168" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Polyglot Architecture</text>
    <text x="24" y="186" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Domain stack, DDL schemas &amp; API specs</text>

    <text x="24" y="218" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Scaffold Baseline &amp; Tests</text>
    <text x="24" y="236" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Executable code tree with smoke tests</text>
  </g>

  <!-- CARD 03: THE CRITIC -->
  <g transform="translate(860, 210)">
    <rect width="340" height="250" rx="8" fill="#0c0c0e"/>
    <rect width="340" height="250" rx="8" fill="none" stroke="url(#card-border)" stroke-width="1"/>
    
    <!-- Header -->
    <text x="24" y="38" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">STAGE 03</text>
    <text x="24" y="66" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="19" font-weight="700">The Critic</text>
    <rect x="238" y="24" width="78" height="20" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="277" y="38" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">AUDIT</text>

    <line x1="24" y1="84" x2="316" y2="84" stroke="#18181b" stroke-width="1"/>

    <!-- Content Items -->
    <text x="24" y="118" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Adversarial OWASP Audit</text>
    <text x="24" y="136" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Threat models, data races &amp; memory safety</text>

    <text x="24" y="168" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Deterministic Linter Gate</text>
    <text x="24" y="186" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Hard AST parser prevents hallucinated scores</text>

    <text x="24" y="218" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13.5" font-weight="600">Strict Quality Gate</text>
    <text x="24" y="236" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Requires score ≥ 80 to authorize commits</text>
  </g>

  <!-- Minimalist Terminal Pill -->
  <g transform="translate(365, 520)">
    <rect width="550" height="48" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1"/>
    <text x="32" y="30" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">$</text>
    <text x="52" y="30" fill="#fafafa" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">npx skills add NotVann/disney-architect</text>
    <text x="490" y="30" fill="#52525b" font-family="'JetBrains Mono', monospace" font-size="11">↵</text>
  </g>
</svg>
