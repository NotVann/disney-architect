<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dreamer-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="realist-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="critic-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1080" cy="450" r="220" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>

  <!-- Badge / Pill -->
  <rect x="470" y="55" width="340" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="640" y="77" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">UNIVERSAL AI AGENT SKILL</text>

  <!-- Main Title -->
  <text x="640" y="150" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="-1">DISNEY ARCHITECT</text>
  
  <!-- Subtitle -->
  <text x="640" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Multi-Stage Software Architecture &amp; Scaffolding Framework</text>

  <!-- 3 Stage Cards -->
  <!-- Card 1: The Dreamer -->
  <g transform="translate(80, 245)">
    <rect width="340" height="230" rx="16" fill="url(#dreamer-card)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="#7c3aed" fill-opacity="0.3"/>
    <text x="45" y="52" fill="#c4b5fd" font-size="18" text-anchor="middle">✦</text>
    <text x="80" y="45" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">1. The Dreamer</text>
    <text x="80" y="65" fill="#a78bfa" font-family="monospace" font-size="12">&lt;DREAMER_STAGE&gt;</text>
    <text x="30" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Zero technical constraint</text>
    <text x="30" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Core value proposition</text>
    <text x="30" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• 3 killer differentiators</text>
  </g>

  <!-- Card 2: The Realist -->
  <g transform="translate(470, 245)">
    <rect width="340" height="230" rx="16" fill="url(#realist-card)" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="#2563eb" fill-opacity="0.3"/>
    <text x="45" y="52" fill="#93c5fd" font-size="18" text-anchor="middle">⚙</text>
    <text x="80" y="45" fill="#eff6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">2. The Realist</text>
    <text x="80" y="65" fill="#60a5fa" font-family="monospace" font-size="12">&lt;REALIST_STAGE&gt;</text>
    <text x="30" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Prunes scope to 48h MVP</text>
    <text x="30" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Polyglot stack &amp; DB schemas</text>
    <text x="30" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Scaffolds runnable code &amp; tests</text>
  </g>

  <!-- Card 3: The Critic -->
  <g transform="translate(860, 245)">
    <rect width="340" height="230" rx="16" fill="url(#critic-card)" stroke="#f87171" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="20" fill="#dc2626" fill-opacity="0.3"/>
    <text x="45" y="52" fill="#fca5a5" font-size="18" text-anchor="middle">🛡</text>
    <text x="80" y="45" fill="#fef2f2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">3. The Critic</text>
    <text x="80" y="65" fill="#f87171" font-family="monospace" font-size="12">&lt;CRITIC_STAGE&gt;</text>
    <text x="30" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Adversarial security &amp; OWASP</text>
    <text x="30" y="145" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• AST deterministic linter gate</text>
    <text x="30" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">• Passing threshold score ≥ 80</text>
  </g>

  <!-- Installation Command Box -->
  <rect x="365" y="520" width="550" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="390" y="552" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="600">$</text>
  <text x="415" y="552" fill="#f1f5f9" font-family="monospace" font-size="15" font-weight="600">npx skills add NotVann/disney-architect</text>
</svg>
